<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg"
x1="0" y1="0"
x2="1" y2="1">
<stop offset="0%" stop-color="#030712"/>
<stop offset="50%" stop-color="#1E1B4B"/>
<stop offset="100%" stop-color="#0891B2"/>
</linearGradient>

<linearGradient id="metal"
x1="0" y1="0"
x2="1" y2="1">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="35%" stop-color="#C4B5FD"/>
<stop offset="70%" stop-color="#67E8F9"/>
<stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

<filter id="shadow">
<feDropShadow dx="0" dy="15"
stdDeviation="20"
flood-opacity=".35"/>
</filter>

</defs>


<!-- Background -->
<rect width="512"
height="512"
rx="128"
fill="url(#bg)"/>


<!-- Soft aura -->
<circle cx="256"
cy="256"
r="150"
fill="#22D3EE"
opacity=".15"
filter="url(#glow)"/>


<!-- Signature loop -->
<path
d="
M256 120
C340 120 392 175 392 256
C392 337 340 392 256 392
C175 392 120 337 120 256
C120 175 175 120 256 120Z"

fill="none"
stroke="url(#metal)"
stroke-width="42"
stroke-linecap="round"
filter="url(#shadow)"/>


<!-- Hidden H cut -->
<path
d="
M205 190V322
M307 190V322
M205 256H307"

stroke="#020617"
stroke-width="22"
stroke-linecap="round"/>


<!-- Glass highlight -->
<path
d="
M175 190
C220 125 320 120 365 180"
fill="none"
stroke="#FFFFFF"
stroke-opacity=".55"
stroke-width="6"
stroke-linecap="round"/>


</svg>