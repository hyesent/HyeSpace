<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glass -->
    <linearGradient id="glass" x1="120" y1="100" x2="400" y2="420">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="shine" x1="120" y1="100" x2="220" y2="220">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18"
        flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Glass Card -->
  <rect
      x="90"
      y="90"
      width="332"
      height="332"
      rx="80"
      fill="url(#glass)"
      stroke="rgba(255,255,255,0.45)"
      stroke-width="2"
      filter="url(#shadow)"/>

  <!-- Shine -->
  <ellipse
      cx="185"
      cy="150"
      rx="110"
      ry="60"
      fill="url(#shine)"
      transform="rotate(-18 185 150)"/>

  <!-- Connections -->
  <g stroke="white" stroke-opacity="0.65" stroke-width="8" stroke-linecap="round">
      <line x1="256" y1="180" x2="256" y2="140"/>
      <line x1="256" y1="332" x2="256" y2="372"/>
      <line x1="180" y1="256" x2="140" y2="256"/>
      <line x1="332" y1="256" x2="372" y2="256"/>
  </g>

  <!-- Nodes -->
  <circle cx="256" cy="140" r="16" fill="white" fill-opacity="0.9"/>
  <circle cx="372" cy="256" r="16" fill="white" fill-opacity="0.9"/>
  <circle cx="256" cy="372" r="16" fill="white" fill-opacity="0.9"/>
  <circle cx="140" cy="256" r="16" fill="white" fill-opacity="0.9"/>

  <!-- Center Orb -->
  <circle
      cx="256"
      cy="256"
      r="72"
      fill="#FFFFFF"
      fill-opacity="0.18"
      stroke="#FFFFFF"
      stroke-opacity="0.6"
      stroke-width="2"/>

  <!-- H -->
  <path
      d="M228 208V304
         M284 208V304
         M228 256H284"
      stroke="#FFFFFF"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"/>

</svg>