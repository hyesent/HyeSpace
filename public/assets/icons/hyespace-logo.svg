<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <linearGradient id="originBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>

    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#DBEAFE"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect
    width="512"
    height="512"
    rx="128"
    fill="url(#originBg)"
  />

  <!-- Ambient light -->
  <circle
    cx="256"
    cy="256"
    r="150"
    fill="#22D3EE"
    opacity=".15"
    filter="url(#softGlow)"
  />

  <!-- Origin crystal -->
  <path
    d="
      M256 90
      L390 168
      L390 344
      L256 422
      L122 344
      L122 168
      Z"
    fill="none"
    stroke="url(#crystal)"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Inner core -->
  <path
    d="
      M190 175
      V337

      M322 175
      V337

      M190 256
      H322"
    stroke="url(#crystal)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Core point -->
  <circle
    cx="256"
    cy="256"
    r="22"
    fill="#FFFFFF"
  />

  <!-- Reflection -->
  <path
    d="
      M160 150
      L256 95
      L350 150"
    stroke="#FFFFFF"
    stroke-opacity=".35"
    stroke-width="5"
    fill="none"
  />

</svg>