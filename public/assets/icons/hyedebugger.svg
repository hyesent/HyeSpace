<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="45%" stop-color="#312E81"/>
    <stop offset="100%" stop-color="#0891B2"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".12"/>
  </linearGradient>

  <linearGradient id="symbol" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#DDEBFF"/>
  </linearGradient>

  <filter id="soft">
    <feDropShadow dx="0" dy="20" stdDeviation="24"
      flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>


<!-- Premium background -->
<rect width="512" height="512" rx="128"
      fill="url(#background)"/>


<!-- Glass container -->
<rect x="105" y="105"
      width="302"
      height="302"
      rx="92"
      fill="url(#glass)"
      stroke="#FFFFFF"
      stroke-opacity=".25"
      filter="url(#soft)"/>


<!-- Inner glow -->
<circle cx="256" cy="256" r="120"
        fill="#FFFFFF"
        fill-opacity=".06"/>


<!-- Hyelab Symbol -->
<g fill="url(#symbol)">

  <!-- Left pillar -->
  <rect x="180" y="170"
        width="38"
        height="172"
        rx="19"/>

  <!-- Right pillar -->
  <rect x="294" y="170"
        width="38"
        height="172"
        rx="19"/>


  <!-- Connecting bridge -->
  <rect x="200" y="237"
        width="112"
        height="38"
        rx="19"/>


  <!-- App module cuts -->
  <circle cx="199" cy="170" r="10"/>
  <circle cx="313" cy="170" r="10"/>
  <circle cx="199" cy="342" r="10"/>
  <circle cx="313" cy="342" r="10"/>

</g>


<!-- Small floating accent -->
<circle cx="390" cy="122"
        r="10"
        fill="#67E8F9"
        opacity=".9"/>

</svg>